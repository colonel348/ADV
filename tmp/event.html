<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <link rel="stylesheet" href="../css/common.css" type="text/css">
    <link rel="stylesheet" href="../css/event.css" type="text/css">
    <script src="../js/common.js"></script>
    <title>event</title>
  </head>
<body>
  <div id="app">
    <!-- 動画 -->
    <div id="videoArea">
      <div id="videoContainer">

        <video
          id="videoA"
          class="movie"
          playsinline
          muted
          webkit-playsinline
          preload="auto">
        </video>

        <video
          id="videoL1"
          class="movie"
          playsinline
          muted
          webkit-playsinline
          preload="auto">
        </video>

        <video
          id="videoL2"
          class="movie"
          playsinline
          muted
          webkit-playsinline
          preload="auto">
        </video>

      </div>
      <div id="fade"></div>
      <div id="controlArea">
        <button id="titleBtn" class="control-btn" type="button">
          <img src="../img/title.png" class="control-icon" alt="">
          <span class="control-text">タイトル</span>
        </button>
        <button id="skipBtn" class="control-btn" type="button">
          <img src="../img/skip.png" class="control-icon" alt="">
          <span class="control-text">スキップ</span>
        </button>
        <button id="nextBtn" class="control-btn" type="button">
          <img src="../img/next.png" class="control-icon" alt="">
          <span class="control-text">次に進む</span>
        </button>
      </div>
    </div>
    <!-- メッセージ -->
    <div id="msgArea">
      <div id="chrName"></div>
      <div id="msgText">
        <span id="msgBody"></span>
        <span id="nextIcon"></span>
      </div>
    </div>
  </div>
  <div id="titleArea">
    <div id="titleText"></div>
  </div>
  <script src="../data/evtData.js"></script>
  <script src="../js/event.js"></script>
</body>
</html>
