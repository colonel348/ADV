<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <link rel="stylesheet" href="../css/common.css" type="text/css">
    <link rel="stylesheet" href="../css/select.css" type="text/css">
    <link rel="stylesheet" href="../css/event.css" type="text/css">
    <script src="../js/common.js"></script>
    <title>event</title>
  </head>
<body data-selection-host="event">
  <div id="eventLevelStatus" class="eventLevelStatus" aria-label="レベル0">
    <div class="eventLevelSegments" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <span class="eventLevelStatusLabel">レベル</span>
    <span id="eventLevelStatusValue" class="eventLevelStatusValue">0</span>
  </div>
  <div id="viewport">
    <div id="bgWrap">
      <img id="bgImg" alt="">
      <video id="selectVideo1" class="selectMovie" playsinline muted webkit-playsinline preload="auto"></video>
      <video id="selectVideo2" class="selectMovie" playsinline muted webkit-playsinline preload="auto"></video>
      <video id="selectPreloadVideo" class="selectPreloadMovie" playsinline muted webkit-playsinline preload="auto"></video>
    </div>
    <div id="bgFade"></div>
    <button id="backBtn" type="button" aria-label="戻る"><img src="../img/back.png" alt=""></button>
    <div id="selectControlArea">
      <button id="selectTitleBtn" class="selectControlBtn" type="button">
        <img src="../img/title.png" class="selectControlIcon" alt=""><span>タイトル</span>
      </button>
    </div>
    <div id="sidebar"><div id="cardList"></div></div>
    <button id="levelSelector" type="button"><span class="levelSelectorLabel">特訓Lv.</span><span id="levelValue">1</span></button>
    <div id="characterStage" class="selectStage">
      <button class="characterCursor characterCursor-left" data-step="-1" type="button"></button>
      <button class="characterCursor characterCursor-right" data-step="1" type="button"></button>
      <div id="characterHint">TAP TO START</div>
      <div id="characterName"><span id="characterNameText"></span></div>
    </div>
    <div id="modeStage" class="selectStage" aria-label="モード選択">
      <div id="modePanel">
        <button class="modeChoice" data-mode="R" data-story="REFREH" type="button">
          <span class="modeChoiceVisual"><img class="modeChoiceImage" src="../img/romance-mode.png" alt=""></span>
          <span class="modeChoiceText"><span class="modeChoiceLabel">休息</span><span class="modeChoiceEnglish">REFREH</span></span>
        </button>
        <button class="modeChoice" data-mode="S" data-story="SERIOUS" type="button">
          <span class="modeChoiceVisual"><img class="modeChoiceImage" src="../img/serious-mode.png" alt=""></span>
          <span class="modeChoiceText"><span class="modeChoiceLabel">特訓</span><span class="modeChoiceEnglish">SERIOUS</span></span>
        </button>
        <button class="modeChoice" data-mode="C" data-story="CONTROL" type="button">
          <span class="modeChoiceVisual"><img class="modeChoiceImage" src="../img/control-mode.png" alt=""></span>
          <span class="modeChoiceText"><span class="modeChoiceLabel">調教</span><span class="modeChoiceEnglish">CONTROL</span></span>
        </button>
      </div>
    </div>
    <div id="selectionTitleArea"><div id="selectionTitleText"></div></div>
    <div id="previewTapPrompt">TAP TO START</div>
    <div id="decisionArea"><div id="decideBtn" class="decideBtn">決定</div></div>
    <div id="preloadImageStage"></div>
    <div id="selectionFade"></div>
  </div>
  <div id="app">
    <!-- 動画 -->
    <div id="videoArea">
      <div id="videoContainer">

        <video
          id="videoA"
          class="movie"
          playsinline
          muted
          webkit-playsinline
          preload="auto">
        </video>

        <video
          id="videoL1"
          class="movie"
          playsinline
          muted
          webkit-playsinline
          preload="auto">
        </video>

        <video
          id="videoL2"
          class="movie"
          playsinline
          muted
          webkit-playsinline
          preload="auto">
        </video>

      </div>
      <div id="fade"></div>
      <div id="controlArea">
        <button id="titleBtn" class="control-btn" type="button">
          <img src="../img/title.png" class="control-icon" alt="">
          <span class="control-text">タイトル</span>
        </button>
        <button id="skipBtn" class="control-btn" type="button">
          <img src="../img/skip.png" class="control-icon" alt="">
          <span class="control-text">スキップ</span>
        </button>
        <button id="nextBtn" class="control-btn" type="button">
          <img src="../img/next.png" class="control-icon" alt="">
          <span class="control-text">次に進む</span>
        </button>
      </div>
    </div>
    <!-- メッセージ -->
    <div id="msgArea">
      <div id="chrName"></div>
      <div id="msgText">
        <span id="msgBody"></span>
        <span id="nextIcon"></span>
      </div>
    </div>
  </div>
  <div id="titleArea">
    <div id="titleText"></div>
  </div>
  <div id="eventEndDialog" class="eventEndDialog" aria-hidden="true">
    <div class="eventEndDialogPanel" role="dialog" aria-modal="true" aria-labelledby="eventEndDialogMessage">
      <p id="eventEndDialogMessage" class="eventEndDialogMessage"></p>
      <div id="eventEndDialogButtons" class="eventEndDialogButtons">
        <button id="eventEndCancelBtn" class="eventEndDialogButton eventEndDialogButton-cancel" type="button">キャンセル</button>
        <button id="eventEndNextBtn" class="eventEndDialogButton eventEndDialogButton-primary" type="button">進む</button>
      </div>
    </div>
  </div>
  <script src="../data/01.evtDat.js"></script>
  <script src="../js/event-media.js"></script>
  <script src="../js/select.js"></script>
  <script src="../js/event.js"></script>
</body>
</html>
