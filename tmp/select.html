<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <title>select</title>
    <link rel="stylesheet" href="../css/common.css" type="text/css">
    <link rel="stylesheet" href="../css/select.css" type="text/css">
    <script src="../data/evtData.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/select.js"></script>
  </head>
  <body>
    <div id="viewport">
      <div id="bgWrap">
        <img id="bgImg" />
      </div>
      <div id="bgFade"></div>

      <button id="backBtn" type="button" aria-label="一つ前の画面へ戻る">
        <img src="../img/back.png" alt="">
      </button>

      <div id="sidebar">
        <div id="cardList"></div>
      </div>

      <div id="characterStage" class="selectStage">
        <button class="characterCursor characterCursor-left" data-step="-1" type="button" aria-label="前のキャラクター"></button>
        <button class="characterCursor characterCursor-right" data-step="1" type="button" aria-label="次のキャラクター"></button>
        <div id="characterHint">TAP TO START</div>
        <div id="characterName"><span id="characterNameText"></span></div>
      </div>

      <div id="modeStage" class="selectStage">
        <div id="modePanel">
          <button class="modeChoice" data-mode="R" type="button">
            <span class="modeChoiceText"><span class="modeChoiceLabel"><span class="modeInitial">恋</span>愛編</span></span>
            <span class="modeChoiceVisual"><img class="modeChoiceImage" alt=""></span>
          </button>
          <button class="modeChoice" data-mode="S" type="button">
            <span class="modeChoiceText"><span class="modeChoiceLabel"><span class="modeInitial">本</span>気編</span></span>
            <span class="modeChoiceVisual"><img class="modeChoiceImage" alt=""></span>
          </button>
          <button class="modeChoice" data-mode="C" type="button">
            <span class="modeChoiceText"><span class="modeChoiceLabel"><span class="modeInitial">調</span>教編</span></span>
            <span class="modeChoiceVisual"><img class="modeChoiceImage" alt=""></span>
          </button>
        </div>
      </div>

      <div id="decisionArea">
        <div id="decideBtn" class="decideBtn">決定</div>
      </div>
      <div id="preloadImageStage"></div>
      <div id="fade"></div>
    </div>
  </body>
</html>
