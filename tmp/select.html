<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <title>select</title>
    <link rel="stylesheet" href="../css/common.css" type="text/css">
    <link rel="stylesheet" href="../css/select.css" type="text/css">
    <script src="../js/common.js"></script>
    <script src="../js/select.js"></script>
  </head>
  <body>
    <div id="viewport">
      <div id="bgWrap">
        <img id="bgImg" />
        <video id="selectVideo1" class="selectMovie" playsinline muted webkit-playsinline preload="auto"></video>
        <video id="selectVideo2" class="selectMovie" playsinline muted webkit-playsinline preload="auto"></video>
      </div>
      <div id="bgFade"></div>

      <div id="characterStage" class="selectStage">
        <button class="characterCursor characterCursor-left" data-step="-1" type="button" aria-label="前のキャラクター"></button>
        <button class="characterCursor characterCursor-right" data-step="1" type="button" aria-label="次のキャラクター"></button>
        <div id="characterHint">TAP TO START</div>
        <div id="characterName"><span id="characterNameText"></span></div>
      </div>

      <div id="selectionFade"></div>
    </div>
  </body>
</html>
