<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
    <title>select</title>
    <link rel="stylesheet" href="../css/common.css" type="text/css">
    <link rel="stylesheet" href="../css/select.css" type="text/css">
    <script src="../data/01.evtDat.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/select.js"></script>
  </head>
  <body>
    <svg class="modeIconFilterDefs" width="0" height="0" aria-hidden="true" focusable="false">
      <defs>
        <filter id="modeIconOutlineR" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="1.55" result="expanded" />
          <feComposite in="expanded" in2="SourceAlpha" operator="out" result="outlineShape" />
          <feFlood flood-color="#dc7ca2" result="outlineColor" />
          <feComposite in="outlineColor" in2="outlineShape" operator="in" result="outline" />
          <feMerge><feMergeNode in="outline" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="modeIconOutlineS" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="1.55" result="expanded" />
          <feComposite in="expanded" in2="SourceAlpha" operator="out" result="outlineShape" />
          <feFlood flood-color="#dc8745" result="outlineColor" />
          <feComposite in="outlineColor" in2="outlineShape" operator="in" result="outline" />
          <feMerge><feMergeNode in="outline" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="modeIconOutlineC" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
          <feMorphology in="SourceAlpha" operator="dilate" radius="1.55" result="expanded" />
          <feComposite in="expanded" in2="SourceAlpha" operator="out" result="outlineShape" />
          <feFlood flood-color="#8d7ed0" result="outlineColor" />
          <feComposite in="outlineColor" in2="outlineShape" operator="in" result="outline" />
          <feMerge><feMergeNode in="outline" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>
    </svg>
    <div id="viewport">
      <div id="bgWrap">
        <img id="bgImg" />
        <video id="selectVideo1" class="selectMovie" playsinline muted webkit-playsinline preload="auto"></video>
        <video id="selectVideo2" class="selectMovie" playsinline muted webkit-playsinline preload="auto"></video>
        <video id="selectPreloadVideo" class="selectPreloadMovie" playsinline muted webkit-playsinline preload="auto"></video>
      </div>
      <div id="bgFade"></div>

      <button id="backBtn" type="button" aria-label="一つ前の画面へ戻る">
        <img src="../img/back.png" alt="">
      </button>

      <div id="sidebar">
        <div id="cardList"></div>
      </div>

      <button id="levelSelector" type="button" aria-label="特訓レベル1。押すと次のレベル">
        <span class="levelSelectorLabel">特訓Lv.</span>
        <span id="levelValue">1</span>
      </button>

      <div id="characterStage" class="selectStage">
        <button class="characterCursor characterCursor-left" data-step="-1" type="button" aria-label="前のキャラクター"></button>
        <button class="characterCursor characterCursor-right" data-step="1" type="button" aria-label="次のキャラクター"></button>
        <div id="characterHint">TAP TO START</div>
        <div id="characterName"><span id="characterNameText"></span></div>
      </div>

      <div id="selectionTitleArea">
        <div id="selectionTitleText"></div>
      </div>

      <div id="previewTapPrompt">TAP TO START</div>

      <div id="decisionArea">
        <div id="decideBtn" class="decideBtn">決定</div>
      </div>
      <div id="preloadImageStage"></div>
      <div id="fade"></div>
    </div>
  </body>
</html>
